<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCI</title>
  <link rel="stylesheet" href="estilos/style.css">
  <link rel="stylesheet" href="estilos/posts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
  <!-- Botao Login canto superior direito -->
  <div class="login-area">
    <button class="login-btn" id="openLogin">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="login-icon">
        <path fill="white" d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/>
      </svg>
      <span>Entrar</span>
    </button>
  </div>

  <!-- Modal de Login -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-modal">
      <div class="modal-top"></div>
      <div class="modal-body">
        <div class="modal-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="avatar-icon">
            <path fill="white" d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/>
          </svg>
        </div>
        <h2 class="modal-title">Area Restrita</h2>
        <form id="loginForm">
          <div class="input-group">
            <input type="text" id="loginUser" placeholder="Usuario" required>
          </div>
          <div class="input-group">
            <input type="password" id="loginPass" placeholder="Senha" required>
          </div>
          <span class="login-error" id="loginError">Usuario ou senha invalido</span>
          <button type="submit" class="modal-submit">Entrar</button>
        </form>
        <button class="modal-close" id="closeLogin">&times;</button>
      </div>
    </div>
  </div>

  <!-- Carrossel de Posts (preenchido via JS) -->
  <div class="swiper slider-wrapper">
    <div class="swiper-wrapper" id="postsContainer">
    </div>

    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/script.js"></script>
  <script src="js/render.js"></script>
</body>

</html>
